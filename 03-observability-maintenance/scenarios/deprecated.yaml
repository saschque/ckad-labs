# Task 3.1 – these manifests use API versions that were removed from Kubernetes.
# Do NOT apply this file as is – convert it first.
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: legacy-ingress
  namespace: maint
spec:
  rules:
    - host: legacy.ckad.lab
      http:
        paths:
          - path: /
            backend:
              serviceName: legacy
              servicePort: 80
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: legacy-pdb
  namespace: maint
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: legacy}
---
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: legacy-hpa
  namespace: maint
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: legacy}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: legacy-cron
  namespace: maint
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - {name: c, image: "busybox:1.36", command: ["date"]}
