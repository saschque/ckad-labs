# Tasks 3.3 and 3.7 – broken workloads, just apply.
apiVersion: v1
kind: Namespace
metadata: {name: debug}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: slow-start, namespace: debug}
spec:
  replicas: 1
  selector: {matchLabels: {app: slow-start}}
  template:
    metadata: {labels: {app: slow-start}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo warming up; sleep 25; mkdir -p /www; echo ok > /www/health; httpd -f -p 8080 -h /www"]
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: d1-api, namespace: debug}
spec:
  replicas: 1
  selector: {matchLabels: {app: d1-api}}
  template:
    metadata: {labels: {app: d1-api}}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "[ -f /config/settings.ini ] || { echo 'ERROR: /config/settings.ini missing' >&2; exit 2; }; sleep 3600"]
          volumeMounts: [{name: cfg, mountPath: /etc/config}]
      volumes:
        - name: cfg
          configMap: {name: d1-config}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: d1-config, namespace: debug}
data: {settings.ini: "debug=false"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: d2-web, namespace: debug}
spec:
  replicas: 1
  selector: {matchLabels: {app: d2-web}}
  template:
    metadata: {labels: {app: d2-web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          resources:
            limits: {memory: 4Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: d3-worker, namespace: debug}
spec:
  replicas: 1
  selector: {matchLabels: {app: d3-worker}}
  template:
    metadata: {labels: {app: d3-worker}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo \"connecting to $QUEUE_HOST\"; sleep 3600"]
          env:
            - name: QUEUE_HOST
              valueFrom: {secretKeyRef: {name: d3-queue, key: host}}
---
apiVersion: v1
kind: Pod
metadata: {name: distroless, namespace: debug, labels: {app: distroless}}
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
